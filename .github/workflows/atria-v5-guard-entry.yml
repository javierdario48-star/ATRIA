name: ATRIA 5 Live Preview Guard Entry

on:
  push:
    branches: [atria-5.0-core-rebuild-experimental]
    paths:
      - 'qa/v5/guard-entry-preview.mjs'
      - 'src/v5/app/application.js'
      - 'src/v5/ui/audio-settings.js'
      - '.github/workflows/atria-v5-guard-entry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-preview-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/atria-guard-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Real Preview accounts, four guard modes, patient interaction and music
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-guard-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          V5_BROWSER_URL: https://night-shift-clinical-git-atria-50-c-fd8524-javierdario4878-7324.vercel.app
        run: node qa/v5/guard-entry-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atria-live-guard-entry
          path: qa/v5-guard-entry-results/
          if-no-files-found: error
          retention-days: 14
