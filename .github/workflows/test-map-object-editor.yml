name: Test mapa - Editor de objetos offline
on:
  push:
    branches: [test-mapa-migracion]
    paths:
      - test-mapa-migracion/index.html
      - test-mapa-migracion/plants/object-editor.js
      - test-mapa-migracion/plants/object-editor.smoke.cjs
      - test-mapa-migracion/plants/bundle_object_editor.py
      - test-mapa-migracion/plants/OBJECT_EDITOR_CHECKPOINT.md
      - .github/workflows/test-map-object-editor.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-p31-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate editor JavaScript
        run: node --check test-mapa-migracion/plants/object-editor.js
      - name: Install source extraction libraries
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Regenerate original-color P31 QA sprites
        run: python test-mapa-migracion/plants/pilot_P31.py
      - name: Build offline HTML and ZIP bundle
        run: python test-mapa-migracion/plants/bundle_object_editor.py
      - name: Install browser test tooling
        run: |
          npm install --no-save --prefix test-mapa-migracion/plants playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            ./test-mapa-migracion/plants/node_modules/.bin/playwright install chromium
          fi
      - name: Test editing, colliders, import/export in desktop and simulated Android
        run: node test-mapa-migracion/plants/object-editor.smoke.cjs
      - name: Check PNG and ZIP integrity (not visual approval)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          from PIL import Image
          out=Path('test-mapa-migracion/editor_bundle')
          p=out/'ATRIA_Editor_Objetos_P31_Experimental.zip'
          with ZipFile(p) as z:
              names=z.namelist()
              assert 'ATRIA_Editor_Offline.html' in names
              assert any(n.endswith('plant_P31.png') for n in names)
              assert z.testzip() is None
          for name in ['desktop_masks.zip','android_masks.zip']:
              with ZipFile(out/name) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert 'ATRIA_objetos_configuracion.json' in names
                  assert 'P31/P31_RGBA.png' in names
                  assert 'P31/P31_occlusion.png' in names
                  cfg=json.loads(z.read('ATRIA_objetos_configuracion.json'))
                  assert cfg['schema']=='atria-objects-editor-v1'
                  assert cfg['objects']
          im=Image.open('test-mapa-migracion/plants/pilot_output/plant_P31.png')
          assert im.size==(68,115) and im.mode=='RGBA'
          print('PASS: offline HTML, ZIP integrity, P31 original-size RGBA; visual QA pending')
          PY
      - name: Upload offline editor and browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATRIA-Editor-Objetos-P31-Offline-Experimental
          path: |
            test-mapa-migracion/editor_bundle/ATRIA_Editor_Offline.html
            test-mapa-migracion/editor_bundle/ATRIA_Editor_Objetos_P31_Experimental.zip
            test-mapa-migracion/editor_bundle/LEER_PRIMERO.txt
            test-mapa-migracion/editor_bundle/android_editor_smoke.png
            test-mapa-migracion/editor_bundle/desktop_editor_smoke.png
          if-no-files-found: warn
          retention-days: 30
