name: Test Mapa Migracion - Plantas exactas
on:
  push:
    branches:
      - test-mapa-migracion
    paths:
      - 'test-mapa-migracion/plants/**'
      - '.github/workflows/test-map-plants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-plants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Extract original-pixel plant cutouts and generate QA
        run: python test-mapa-migracion/plants/extract_plants.py
      - name: Verify the generated sprites and original colors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('test-mapa-migracion/plants/output')
          m=json.loads((p/'plants_physics_manifest.json').read_text())
          assert len(m['instances'])>=40
          assert all(i['source_pixel_diff_max']==0 for i in m['instances'])
          for i in m['instances']:
              sprite=Image.open(p/i['png'])
              assert sprite.mode=='RGBA'
              assert sprite.size==(i['width_px'],i['height_px'])
          print('PASS: source-pixel color preservation and output dimensions for',len(m['instances']),'plant candidates')
          PY
      - name: Upload extraction candidates and validation plates
        uses: actions/upload-artifact@v4
        with:
          name: atria-plants-original-pixel-candidates
          path: test-mapa-migracion/plants/output/
          retention-days: 30
