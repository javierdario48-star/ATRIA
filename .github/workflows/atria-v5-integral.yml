name: ATRIA 5 Native Clinical Matrix
on:
  push:
    branches: [atria-5.0-core-rebuild-experimental]
    paths:
      - .github/workflows/atria-v5-integral.yml
      - qa/v5/clinical-integral-*.mjs
      - src/v5/content/certified-case-packs.json
      - src/v5/content/cases.json
      - src/v5/clinical/guard-runtime.js
      - src/v5/clinical/studies.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atria-v5-integral-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute public-runtime journeys against this checkout
        run: node qa/v5/clinical-integral-ci-shard.mjs "${{ matrix.shard }}" 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atria-v5-native-journeys-${{ matrix.shard }}
          path: qa/v5-integral-shard-results/
          if-no-files-found: error
          retention-days: 30
