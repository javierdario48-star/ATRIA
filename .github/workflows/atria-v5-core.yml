name: ATRIA 5 Experimental Game

on:
  push:
    branches: [atria-5.0-core-rebuild-experimental, atria-5.0-compact-keyboard-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the original module based core
        run: npm run test:v5-core
      - name: Canonical content, navigation, study and independent game contracts
        run: npm run test:v5
      - name: Native compact ATRIA keyboard editing contracts
        run: node --test src/v5/ui/atria-keyboard.test.js
      - name: Original CIRR dose, preparation and physiological trajectories remain equivalent
        run: node qa/v5/characterize-cirr-native.mjs
      - name: Characterize original APP dual antibiotics and fluid response (QA-only)
        run: node qa/v5/characterize-app-native.mjs
      - name: Original surgical requests, delayed refusals and corrected acceptance remain equivalent
        run: node qa/v5/characterize-surgery-native.mjs
      - name: Original special support doses, respiratory harm, infusion titration and withdrawal remain equivalent
        run: node qa/v5/characterize-special-support-native.mjs
      - name: Original secondary peritonitis longitudinal physiology and genuine preparation remain equivalent
        run: node qa/v5/characterize-peritonitis-native.mjs
      - name: Actual V19 peritonitis quality and career XP remain graded and equivalent
        run: node qa/v5/characterize-peritonitis-quality.mjs
      - name: Executable V4 clinical harm-and-exposure parity gate (QA-only)
        run: node qa/v5/clinical-parity-gate.mjs
      - name: Contrast rapid iatrogenic fluid response against untreated legacy control
        run: node qa/v5/characterize-rapid-harm.mjs
      - name: Characterize all eight consecutive Ringer doses against effective V4 and recorded V5 monitor
        run: node qa/v5/fluid-eight-bolus-comparison.mjs
      - name: Separate V4 dose-response from elapsed-time smoothing across 0 1 2 4 8 fluid boluses
        run: node qa/v5/fluid-matched-dose-counterfactual.mjs
      - name: Record original generated physiology writer identities without importing them to V5
        run: node qa/v5/legacy-clinical-owner-source.mjs
      - name: Effective original CIRR and APP exam findings remain equivalent
        run: node qa/v5/characterize-exam-native.mjs
      - name: Visible monitor screens match the effective final original scene
        run: node qa/v5/characterize-monitor-native.mjs
      - name: Native patient profiles, compound pain questions and follow-ups remain equivalent
        run: node qa/v5/characterize-dialogue-native.mjs
      - name: Enforce V5 architectural boundary, no legacy patchers or parallel animation loops
        run: node scripts/audit-v5-boundary.mjs
      - name: Build independent V5 module distribution
        run: npm run build:v5-core
      - name: Build independent executable V5 game
        run: npm run build:v5
      - name: Reused proven legacy contracts
        run: node src/social/room-state.test.js && node src/app/frame-scheduler.test.js && node src/clinical/nurse-scanner-487.test.js
      - name: Immutable 4.8.6 clinical source remains preserved
        run: node src/app/golden-master-contract.test.js
      - name: Legacy playable build remains operational
        run: npm run build
      - name: New core cannot depend on string anchor patching
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names=['src/v5/core/room-authority.js','src/v5/core/speech-router.js','src/v5/core/replica.js','src/v5/adapters/native-clinical-port.js'];
          for (const name of names){
            const source=fs.readFileSync(name,'utf8');
            if (/apply487\(|replaceOnce\(|document\.write\(|eval\(/.test(source)) throw Error('old source patch in '+name);
          }
          console.log('new-core:no-generated-source-patching');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: atria-v5-independent-game
          path: |
            out-v5/
            out-v5-core/
          retention-days: 14

  independent-game-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Build the game without historical HTML
        run: npm run build:v5
      - name: Real albumin, blood, amphotericin and pressor receipts through spatial nursing in desktop and Pixel
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/special-support-browser.mjs
      - name: Complete secondary peritonitis from actual desktop and Pixel UI through safe surgical handoff and unique XP
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/peritonitis-browser.mjs
      - name: Desktop, Android emulation, landscape, transitions, IME and disposal
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run qa:v5-browser
      - name: Compact ATRIA keyboard, camera alignment, typing, guard and rotation
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/keyboard-camera-browser.mjs
      - name: Boot failures, saved appearance, focus and rotation regressions
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/boot-focus-browser.mjs
      - name: World patient and monitor taps, anatomical exam, Glasgow and known measurements
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/hospital-interactions-browser.mjs
      - name: Clinical deadlines survive a real long frame and preserve native typing pace
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/clinical-clock-browser.mjs
      - name: Natural patient dialogue, acquired history, symptom context and one global transcript
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/patient-dialogue-browser.mjs
      - name: Real study requests, original results, pending duplicates and case selection
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/studies-browser.mjs
      - name: Complete CIRR through real UI, native administration, reassessment, closure and unique persisted XP
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/cirr-browser.mjs
      - name: Complete APP through real IV antibiotics, fluids, surgical consultation, handoff and unique XP
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/app-browser.mjs
      - name: Floating diagnosis, global vocabulary, IME, clear and surgical refusals in desktop and Pixel
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/diagnosis-browser.mjs
      - name: Clinical freedom, actual allergic reaction, physical nursing and history in desktop and mobile
        # C1 tests the published ESM modules, physical nurse and clinical panels.
        # It creates an explicit allergy scenario; it does not alter live state.
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/clinical-freedom-browser.mjs
      - name: Actual morphine dose, respiratory depression, unique receipt and oxygen support in desktop and mobile
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/morphine-browser.mjs
      - name: Capture unchanged original lobby as a visual control
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run build && node qa/v5/capture-reference.mjs
      - name: Compare original lobby background at identical viewport and camera
        run: |
          python -m pip install Pillow==11.3.0
          python qa/v5/compare-background.py qa/v5-reference-results/reference-lobby.png qa/v5-browser-results/android-emulated-lobby.png qa/v5-browser-results/visual-background-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atria-v5-browser-evidence
          path: |
            qa/v5-browser-results/
            qa/v5-reference-results/reference-lobby.png
            qa/v5-reference-results/reference-title.png
          retention-days: 14

  actual-http-multiplayer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Independent Chromium processes for 2/3/4 users and real HTTP clinical relay
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/v5/room-http-browser.mjs

  preserved-historical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full historical regression remains enabled
        run: npm test
