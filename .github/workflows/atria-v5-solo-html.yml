name: ATRIA 5 Downloadable Solo HTML

on:
  push:
    branches: [atria-5.0-core-rebuild-experimental]
    paths:
      - 'scripts/build-v5-solo-compact.mjs'
      - 'scripts/verify-v5-solo-compact.mjs'
      - 'scripts/audit-v5-solo-compact.mjs'
      - 'scripts/verify-v5-offline-v2-journey.mjs'
      - 'scripts/verify-v5-offline-varix-v2.mjs'
      - 'src/v5/clinical/**'
      - 'src/v5/content/**'
      - 'src/v5/app/**'
      - 'src/v5/ui/**'
      - 'src/v5/render/**'
      - 'src/v5/engine/**'
      - '.github/workflows/atria-v5-solo-html.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atria-v5-solo-html-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-solo-html:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated one-file bundler and test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atria-html-builder" --no-save esbuild@0.25.12
          npm install --prefix "$RUNNER_TEMP/atria-html-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Package original V5 in a self-contained HTML
        env:
          ATRIA_ESBUILD_MODULE: ${{ runner.temp }}/atria-html-builder/node_modules/esbuild
          ATRIA_SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/build-v5-solo-compact.mjs
          node scripts/build-v5-solo-compact.mjs --resp01-v2
          node scripts/build-v5-solo-compact.mjs --varix-v2
          node scripts/build-v5-solo-compact.mjs --all-v2
      - name: Verify atomic local checkpoint owners before the browser
        run: node --test src/v5/app/local-guard-checkpoint.test.js src/v5/app/local-shift.test.js src/v5/content/packs/offline-v2-packs.test.js
      - name: Verify browser, lobby and solo guard on Chrome and emulated Android
        env:
          ATRIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atria-html-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/verify-v5-solo-compact.mjs
      - name: Audit the actual HTML as a player (desktop, Android and accelerated admission clock)
        env:
          ATRIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atria-html-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/audit-v5-solo-compact.mjs
      - name: Complete genuine offline V2 care, pending nursing save, reload, recovery, closure and XP on desktop and Pixel
        env:
          ATRIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atria-html-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/verify-v5-offline-v2-journey.mjs
      - name: Verify VARIX V2 native admissions, shock, unsafe decision, false endoscopy and recovery on Chrome/Pixel
        env:
          ATRIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atria-html-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/verify-v5-offline-varix-v2.mjs
      - name: Verify all three revisions through the combined HTML
        env:
          ATRIA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atria-html-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          ATRIA_OFFLINE_COMBINED: '1'
        run: |
          node scripts/verify-v5-offline-v2-journey.mjs
          node scripts/verify-v5-offline-varix-v2.mjs
          ATRIA_OFFLINE_CASE=CARD-08 node scripts/verify-v5-offline-varix-v2.mjs
      - name: Publish downloadable HTML and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atria-v5-solo-html
          path: out-solo-html/
          if-no-files-found: error
          retention-days: 30
