name: Test mapa plantas - colisiones v3
on:
  push:
    branches: [test-mapa-migracion]
    paths:
      - test-mapa-migracion/plants/asymmetric-plant-collider.mjs
      - test-mapa-migracion/plants/asymmetric-plant-collider.test.mjs
      - .github/workflows/test-map-plants-collider.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collision-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test-mapa-migracion/plants/asymmetric-plant-collider.test.mjs
