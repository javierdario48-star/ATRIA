name: ATRIA Architecture QA
on:
  push:
    branches: [main, atria-4.8.7-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture regression tests
        run: npm test
      - name: Build QA preview
        run: npm run build
      - name: Validate output safety
        run: |
          test -s out/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('out/index.html','utf8');
          if(!/4\.8\.6/.test(h)) throw new Error('QA baseline marker missing');
          if(!/Estudios solicitados/i.test(h)) throw new Error('Study UI contract missing');
          console.log('output safety OK');
          NODE
      - name: Syntax-check generated task scripts
        run: |
          for f in out/task*.js; do [ -e "$f" ] || continue; node --check "$f"; done
      - name: Package byte-faithful 4.8.6 capture
        run: |
          mkdir -p golden-master-4.8.6
          cp out/index.html golden-master-4.8.6/
          cp out/task*.js golden-master-4.8.6/ 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir='golden-master-4.8.6';
          const files=fs.readdirSync(dir).sort();
          const manifest={version:'4.8.6',capturedFrom:'https://night-shift-clinical.vercel.app',files:{}};
          for(const f of files){const b=fs.readFileSync(dir+'/'+f);manifest.files[f]={bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')}}
          fs.writeFileSync(dir+'/MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(manifest);
          NODE
      - name: Upload golden master capture
        uses: actions/upload-artifact@v4
        with:
          name: atria-golden-master-4.8.6
          path: golden-master-4.8.6/
          retention-days: 30
          if-no-files-found: error
