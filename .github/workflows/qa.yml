name: ATRIA Architecture QA
on:
  push:
    branches: [main, atria-4.8.7-qa, atria-4.8.7-grace-nursing-qa, atria-4.8.7-morphine-qa, atria-4.8.7-heparin-care-qa, atria-4.8.7-heparin-harm-qa, atria-4.8.7-general-therapy-rules-qa, atria-4.8.7-clinical-matrix-bots-qa, atria-4.8.7-care-journeys-qa, atria-4.8.7-case-completion-qa, atria-4.8.7-closure-harm-combinatorial-qa, atria-4.8.7-multiplayer-stabilization]
  workflow_dispatch:
permissions:
  contents: read
jobs:

  clinical-room-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Real full-game chat and clinical clients
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_STAGE: all
          CLINICAL_OUTPUT: qa/clinical-browser-results/${{ matrix.players }}
        run: node qa/clinical-room-browser-487.mjs
      - name: Native nursing and both antibiotics on real 2–4-client guard
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_STAGE: G
          CLINICAL_OUTPUT: qa/clinical-browser-results/${{ matrix.players }}-nursing
        run: node qa/clinical-room-browser-487.mjs
      - name: First clinical speech before nursing, including party host not owning patient
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_STAGE: C
          CLINICAL_OUTPUT: qa/clinical-browser-results/${{ matrix.players }}-first-chat
        run: node qa/clinical-room-browser-487.mjs
      - name: Real competitive simultaneous claims, owner permissions and tampered rival order
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_STAGE: I
          CLINICAL_OUTPUT: qa/clinical-browser-results/${{ matrix.players }}-competitive
        run: node qa/clinical-room-browser-487.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-independent-clients-${{ matrix.players }}
          path: qa/clinical-browser-results/
          retention-days: 14

  remote-motion-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test driver and video encoder
        run: |
          npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
          node "$RUNNER_TEMP/atria-browser/node_modules/playwright/cli.js" install ffmpeg
      - name: Build the exact reference without changing the working checkout
        if: matrix.players == 2
        run: |
          git fetch --depth=1 origin 2f13db3ce1c47f58618c0955ca6e3c900f7f9aab
          mkdir -p "$RUNNER_TEMP/atria-motion-reference"
          git archive 2f13db3ce1c47f58618c0955ca6e3c900f7f9aab | tar -x -C "$RUNNER_TEMP/atria-motion-reference"
          cd "$RUNNER_TEMP/atria-motion-reference"
          node build.js
      - name: Reproduce reference A to B and B to A on real RTC and HTTP
        if: matrix.players == 2
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          MOTION_SOURCE_HTML: ${{ runner.temp }}/atria-motion-reference/out/index.html
          MOTION_SOURCE_SERVER: ${{ runner.temp }}/atria-motion-reference/src/social/qa-social-server.js
          MOTION_LABEL: reference
          MOTION_VIDEO: '1'
        run: node qa/remote-motion-browser-487.mjs
      - name: Independent clients, FPS, jitter, loss, fallback, reload and second guard
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          MOTION_LABEL: final-${{ matrix.players }}
          MOTION_PLAYERS: ${{ matrix.players }}
          MOTION_EXTENDED: '1'
          MOTION_VIDEO: ${{ matrix.players == 2 && '1' || '0' }}
        run: node qa/remote-motion-browser-487.mjs
      - name: Measured improvement over the exact reference on the same runner
        if: matrix.players == 2
        run: node qa/remote-motion-compare-487.mjs qa/remote-motion-results/reference/summary.json qa/remote-motion-results/final-2/summary.json qa/remote-motion-results/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-motion-measurements-${{ matrix.players }}
          path: qa/remote-motion-results/
          retention-days: 14

  global-chat-interactions-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Native chat interactions across independent doctors and NPCs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_OUTPUT: qa/global-chat-browser-results/${{ matrix.players }}
        run: node qa/global-chat-interactions-487.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-chat-independent-clients-${{ matrix.players }}
          path: qa/global-chat-browser-results/
          retention-days: 14

  nurse-study-medication-safety-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium drivers
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Study-only hemogram never administers albumin
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CLINICAL_PLAYERS: ${{ matrix.players }}
          CLINICAL_OUTPUT: qa/hemogram-dose-results/${{ matrix.players }}
        run: node qa/hemogram-albumin-browser-487.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hemogram-dose-proof-${{ matrix.players }}
          path: qa/hemogram-dose-results/
          retention-days: 14

  npc-chat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/atria-browser" --no-save --ignore-scripts playwright@1.58.2
      - name: Desktop and Android-emulated native canvas/editor regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/atria-browser/node_modules/playwright
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node qa/chat-browser-487.mjs

  immutable-source-and-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen clinical source before lengthy regression
        run: node src/integration/vega-integrity-487.test.js && node src/clinical/physiology-native-reference-487.test.js
      - name: Verify NPC mentions and the thirteen-case Vega dialogue
        run: node src/integration/chat-recipient-487.test.js && node src/integration/chat-protocol-487.test.js && node src/integration/vega-consult-matrix-487.test.js && node src/integration/vega-native-flow-487.test.js && node src/integration/vega-full-matrix-487.test.js
      - name: Verify exact baseline byte recovery and generated artifact
        run: npm run build && npm run qa:physiology-artifact


  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture and historical regression tests
        run: npm test
      - name: Confirmed nursing shadow journeys
        run: npm run qa:physiology-live
      - name: Offline golden-master build
        run: npm run build && npm run qa:physiology-artifact
      - name: Validate output safety
        run: |
          test -s out/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('out/index.html','utf8');
          if(!/4\.8\.6/.test(h)) throw new Error('QA baseline marker missing');
          if(!/Estudios solicitados/i.test(h)) throw new Error('Study UI contract missing');
          if(/<script[^>]+src=["'][^"']*task7\.js/i.test(h)) throw new Error('legacy task7 study fallback is still loaded');
          if(/<script[^>]+src=["'][^"']*task8\.js/i.test(h)) throw new Error('legacy task8 study poller is still loaded');
          if(/<script[^>]+src=["'][^"']*task12\.js/i.test(h)) throw new Error('legacy task12 study poller is still loaded');
          if(/<script[^>]+src=["'][^"']*task13\.js/i.test(h)) throw new Error('legacy task13 PTT primer still preempts task5 group voice');
          for(const f of ['task7.js','task8.js','task12.js','task13.js']) if(!fs.existsSync('out/'+f)) throw new Error(f+' golden-master copy missing');
          console.log('output safety OK; golden-master files preserved but redundant study pollers are not loaded');
          NODE
      - name: Syntax-check generated JavaScript
        run: |
          for f in out/task*.js; do [ -e "$f" ] || continue; node --check "$f"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const html=fs.readFileSync('out/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map((m,i)=>({n:i+1,code:m[1]})).filter(x=>x.code.trim());
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'atria-inline-'));
          for(const s of scripts){
            const file=path.join(dir,'inline-'+s.n+'.js');fs.writeFileSync(file,s.code);
            const q=spawnSync(process.execPath,['--check',file],{encoding:'utf8'});
            if(q.status!==0)throw new Error('inline script '+s.n+' syntax failure\\n'+q.stderr);
          }
          console.log('inline scripts syntax OK:',scripts.length);
          NODE
      - name: Upload integrated QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: atria-4.8.7-qa-candidate
          path: |
            out/
            qa/clinical-matrix-results/
            qa/care-journey-results/
            qa/outcome-combinatorial-results/
            qa/closure-harm-results/
            qa/android-fix-results/
          retention-days: 14
          if-no-files-found: error
