name: ATRIA Architecture QA
on:
  push:
    branches: [main, atria-4.8.7-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture and historical regression tests
        run: npm test
      - name: Offline golden-master build
        run: npm run build
      - name: Validate output safety
        run: |
          test -s out/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('out/index.html','utf8');
          if(!/4\.8\.6/.test(h)) throw new Error('QA baseline marker missing');
          if(!/Estudios solicitados/i.test(h)) throw new Error('Study UI contract missing');
          for(const f of ['task8.js','task12.js']){const x=fs.readFileSync('out/'+f,'utf8');if(/MutationObserver|setInterval/.test(x))throw new Error(f+' legacy DOM hot loop still active');}\n          console.log('output safety OK; redundant study DOM hot loops retired');
          NODE
      - name: Syntax-check generated JavaScript
        run: |
          for f in out/task*.js; do [ -e "$f" ] || continue; node --check "$f"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const html=fs.readFileSync('out/index.html','utf8');
          const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map((m,i)=>({n:i+1,code:m[1]})).filter(x=>x.code.trim());
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'atria-inline-'));
          for(const s of scripts){
            const file=path.join(dir,'inline-'+s.n+'.js');fs.writeFileSync(file,s.code);
            const q=spawnSync(process.execPath,['--check',file],{encoding:'utf8'});
            if(q.status!==0)throw new Error('inline script '+s.n+' syntax failure\\n'+q.stderr);
          }
          console.log('inline scripts syntax OK:',scripts.length);
          NODE
      - name: Upload integrated QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: atria-4.8.7-qa-candidate
          path: out/
          retention-days: 14
          if-no-files-found: error
