name: ATRIA 4.8.7 Candidate QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate from immutable production baseline
        run: npm run build
      - name: Validate candidate invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('out/index.html','utf8');
          const req=[
            ["version 4.8.7",/version:'4\.8\.7'/],
            ["self echo guard",/pid!==selfId/],
            ["roster guard",/dc\.peerGameIds\.includes\(pid\)/],
            ["adaptive peer cadence",/player\?\.moving\?110:220/],
            ["lobby 180ms poll",/\+180<t/],
            ["remote interpolation",/__vx/],
            ["history visible",/#chatHistoryMini\.show\{display:block!important\}/],
            ["keyboard history hide",/keyboardOpen[^}]*chatHistoryMini\{display:none!important\}/],
            ["study requested UI",/Estudios solicitados/i]
          ];
          let bad=0;
          for(const [n,re] of req){const ok=re.test(h);console.log(ok?'PASS':'FAIL',n);if(!ok)bad++}
          const task13=fs.existsSync('out/task13.js');
          console.log(task13?'PASS':'FAIL','task13 social voice preserved');
          if(!task13)bad++;
          if(bad)process.exit(1);
          NODE
      - name: Syntax-check generated task scripts
        run: |
          for f in out/task*.js; do node --check "$f"; done
