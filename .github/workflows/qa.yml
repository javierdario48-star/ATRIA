name: ATRIA Architecture QA
on:
  push:
    branches: [main, atria-4.8.7-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture regression tests
        run: npm test
      - name: Build QA preview
        run: npm run build
      - name: Validate output safety
        run: |
          test -s out/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('out/index.html','utf8');
          if(!/4\.8\.6/.test(h)) throw new Error('QA baseline marker missing');
          if(!/Estudios solicitados/i.test(h)) throw new Error('Study UI contract missing');
          if(!/__ATRIA_ARCH/.test(h)) throw new Error('Architecture runtime missing');
          if(!/maxCatchUp:5/.test(h)) throw new Error('Bounded catch-up missing');
          if(!/updateSimulation\(0\);mentorTick\(\);qaBotTick\(now\)/.test(h)) throw new Error('Maintenance separation missing');
          console.log('output safety OK');
          NODE
      - name: Syntax-check generated task scripts
        run: |
          for f in out/task*.js; do [ -e "$f" ] || continue; node --check "$f"; done
