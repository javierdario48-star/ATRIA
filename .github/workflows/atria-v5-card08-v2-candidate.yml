name: ATRIA V5 CARD-08 V2 Admission (isolated)
on:
  push:
    branches: [atria-5.0-core-rebuild-experimental]
    paths:
      - 'qa/v5/card08-v2-admission.mjs'
      - 'qa/v5/certify-clinical-cases.mjs'
      - 'qa/v5/resp01-v2-graph-branches.mjs'
      - 'src/v5/content/packs/card08-v2-*.js'
      - 'src/v5/content/packs/v2-staging-candidates.js'
      - 'src/v5/clinical/**'
      - '.github/workflows/atria-v5-card08-v2-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [solo, apprentice, coop, competitive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paired V1/V2, alternative groups, seeded complication and authentic surgical receiver
        env:
          CARD08_QA_MODE: ${{ matrix.mode }}
        run: node qa/v5/card08-v2-admission.mjs
      - name: Shared unsafe-disposition, allergy, rescue, mentor and recovery branch audit
        if: always()
        env:
          V2_GRAPH_CASE: CARD-08
          V2_GRAPH_MODE: ${{ matrix.mode }}
        run: node qa/v5/resp01-v2-graph-branches.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atria-card08-v2-${{ matrix.mode }}
          path: |
            qa/v5-card08-v2-${{ matrix.mode }}/
            qa/v5-card08-v2-graph/
          if-no-files-found: error
          retention-days: 45
