name: ATRIA V5 RESP-01 V2 Candidate (isolated)
on:
  push:
    branches: [atria-5.0-core-rebuild-experimental]
    paths:
      - 'src/v5/content/packs/respiratory-v2-candidate.js'
      - 'src/v5/content/packs/respiratory-v2-graph.js'
      - 'src/v5/clinical/clinical-graph-observer*'
      - 'src/v5/clinical/public-receiver-record*'
      - 'qa/v5/resp01-v2-graph-branches.mjs'
      - 'src/v5/content/packs/respiratory-v2-candidate.test.js'
      - 'src/v5/content/packs/respiratory-v2-e2e-audit.test.js'
      - 'src/v5/content/packs/respiratory-v2-personality-audit.test.js'
      - 'src/v5/content/packs/respiratory-v2-hint-walkthrough.test.js'
      - 'src/v5/content/packs/respiratory-v2-observation-flow.test.js'
      - 'src/v5/clinical/clinical-policy-closure.js'
      - 'src/v5/clinical/clinical-rescue-logic.js'
      - 'src/v5/clinical/clinical-rescue-logic.test.js'
      - 'src/v5/clinical/clinical-graph-observer.js'
      - 'src/v5/clinical/clinical-graph-observer.test.js'
      - 'src/v5/clinical/clinical-deterioration-causes.js'
      - 'src/v5/clinical/clinical-stabilization-requirements.js'
      - 'src/v5/clinical/clinical-deterioration-causes.test.js'
      - 'src/v5/clinical/medication-indication-review.js'
      - 'src/v5/clinical/medication-indication-review.test.js'
      - 'src/v5/clinical/hidden-requirements-scoring.test.js'
      - 'src/v5/clinical/native-medications.js'
      - 'src/v5/clinical/clinical-risk.js'
      - 'src/v5/clinical/clinical-disposition-safety.js'
      - 'src/v5/clinical/clinical-disposition-safety.test.js'
      - 'src/v5/clinical/unsafe-disposition-continuity.test.js'
      - 'src/v5/clinical/unsafe-disposition-runtime.test.js'
      - 'src/v5/clinical/guard-runtime.js'
      - 'src/v5/clinical/observations.js'
      - 'src/v5/clinical/acute-care.js'
      - 'src/v5/clinical/progression.test.js'
      - 'src/v5/ui/clinical-controller.js'
      - 'src/v5/ui/clinical-closure-panel.js'
      - 'src/v5/ui/clinical-bedside-ux.test.js'
      - 'src/v5/clinical/guard-session.js'
      - 'src/v5/clinical/surgical-consultation.js'
      - 'src/v5/clinical/clinical-hint-ledger.js'
      - 'supabase/migrations/**'
      - 'qa/v5/persistence/**'
      - 'src/v5/clinical/progression.js'
      - 'src/v5/clinical/public-receiver-policy.js'
      - 'src/v5/clinical/public-receiver-policy.test.js'
      - 'src/v5/clinical/clinical-policy-registry.js'
      - 'qa/v5/resp01-v2-parity.mjs'
      - 'qa/v5/resp01-v2-all-modes.mjs'
      - 'scripts/export-atria-v5-rules.mjs'
      - 'scripts/export-atria-v5-rules.test.mjs'
      - 'docs/contracts/ATRIA-V5-RULES-v1.0.0.json'
      - 'docs/contracts/ATRIA-V5-RULES-v1.0.1.json'
      - 'docs/contracts/README.md'
      - 'src/v5/clinical/accepted-transfer.test.js'
      - 'qa/v5/transfer-certification.mjs'
      - 'src/v5/core/disposition-receipt.js'
      - '.github/workflows/atria-v5-resp01-v2-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atria-v5-resp01-v2-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate is isolated and obeys native policy
        run: node --test src/v5/content/packs/respiratory-v2-candidate.test.js src/v5/content/packs/respiratory-v2-e2e-audit.test.js src/v5/content/packs/respiratory-v2-personality-audit.test.js src/v5/content/packs/respiratory-v2-hint-walkthrough.test.js src/v5/clinical/clinical-disposition-safety.test.js src/v5/clinical/public-receiver-policy.test.js src/v5/clinical/unsafe-disposition-continuity.test.js src/v5/clinical/unsafe-disposition-runtime.test.js src/v5/clinical/progression.test.js src/v5/ui/clinical-bedside-ux.test.js src/v5/content/packs/respiratory-v2-observation-flow.test.js
      - name: Existing policy closure regression
        run: node --test src/v5/clinical/clinical-policy-closure.test.js src/v5/clinical/clinical-rescue-logic.test.js src/v5/clinical/clinical-graph-observer.test.js src/v5/clinical/clinical-deterioration-causes.test.js
      - name: Historical partial disposition and universal transfer regressions
        run: node --test src/v5/clinical/accepted-transfer.test.js src/v5/clinical/partial-closure.test.js
      - name: Universal medication freedom and scoring certification
        run: node --test src/v5/clinical/medication-indication-review.test.js src/v5/clinical/clinical-risk-regression.test.js src/v5/clinical/clinical-freedom.test.js src/v5/clinical/hidden-requirements-scoring.test.js
      - name: Universal clinical regression (medication harm, delayed physiology, dialogue, Vega, rescue)
        run: |
          node --test src/v5/clinical/clinical-policy-effects.test.js \
            src/v5/clinical/inappropriate-medication-bots.test.js \
            src/v5/clinical/clinical-risk-regression.test.js \
            src/v5/clinical/clinical-rescue-paths.test.js \
            src/v5/clinical/clinical-freedom.test.js \
            src/v5/clinical/patient-dialogue.test.js \
            src/v5/clinical/clinical-hint-session.test.js

  paired-native-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare V1 and V2 with same native runtime and paired seeds
        run: node qa/v5/resp01-v2-parity.mjs
      - name: Save full native receipts, patient trajectories and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atria-resp01-v1-v2-native-evidence
          path: qa/v5-resp01-v2-parity/
          if-no-files-found: warn
          retention-days: 30

  versioned-mode-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify extractable immutable clinical and four-mode contract
        run: node --test scripts/export-atria-v5-rules.test.mjs
      - name: Export recoverable rules artifact without modifying sources
        run: |
          node scripts/export-atria-v5-rules.mjs --version 1.0.0 --out qa/v5-rule-snapshots
          node scripts/export-atria-v5-rules.mjs --version 1.0.1 --out qa/v5-rule-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: atria-v5-immutable-rules-1.0.0-and-1.0.1
          path: qa/v5-rule-snapshots/
          if-no-files-found: error
          retention-days: 90

  four-mode-native-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise V2 in solo, apprentice, cooperative and competitive, nine profiles each
        run: node qa/v5/resp01-v2-all-modes.mjs
      - name: Exercise additional graph branches with unsafe choices, real excessive dose, allergy, rescue, observation, Vega and recovery
        run: node qa/v5/resp01-v2-graph-branches.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atria-resp01-v2-36-native-scenarios
          path: |
            qa/v5-resp01-v2-modes/
            qa/v5-resp01-v2-graph/
          if-no-files-found: warn
          retention-days: 30

  vercel-build-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build modular ATRIA 5 bundle without deployment
        run: npm run build:v5
      - name: Verify Vercel target is coherent with built output
        run: |
          test -s out-v5/index.html
          test -s out-v5/manifest.json
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('vercel.json','utf8')); if(v.outputDirectory!=='out-v5')process.exit(1)"
