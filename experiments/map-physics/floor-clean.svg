<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><title>ATRIA — piso limpio, sin objetos</title><desc>Una base neutral nueva, sin mobiliario ni paredes, que conserva 1024 × 1536 px y la cuadrícula 32 × 53. No es un borrado fotográfico de píxeles ocultos por el mobiliario.</desc><defs><pattern id="tiles" width="32" height="28.9811320754717" patternUnits="userSpaceOnUse"><rect width="32" height="28.9811320754717" fill="#e5ebe9"/><path d="M32 0H0V28.9811320754717" fill="none" stroke="#d0d8d6" stroke-width=".75"/></pattern><pattern id="major" width="160" height="144.9056603773585" patternUnits="userSpaceOnUse"><path d="M160 0H0V144.9056603773585" fill="none" stroke="#afc5c0" stroke-opacity=".65" stroke-width="1.3"/></pattern></defs><rect width="1024" height="1536" fill="#e5ebe9"/><rect width="1024" height="1536" fill="url(#tiles)"/><rect width="1024" height="1536" fill="url(#major)"/></svg>
